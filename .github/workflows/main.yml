name: Build and Deploy ASASERA Frontend

on:
  push:
    branches:
      - main
  # Added so the OIDC cutover run can be started by hand once, and afterwards
  # to re-deploy main without inventing an empty commit. The push trigger is
  # unchanged.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # `id-token: write` is what lets the runner mint the OIDC token that is
    # exchanged for the deploy role. `contents: read` is the checkout right
    # this job already needed. Declaring the block narrows every other scope to
    # none, which matters more here than in the backend: this repository is
    # public, so the job's GITHUB_TOKEN should be able to write nothing.
    permissions:
      contents: read
      id-token: write

    env:
      # No static AWS key pair. The OIDC step below exports the frontend deploy
      # role's temporary credentials into the environment instead. This
      # workflow syncs no Kubernetes Secret, so unlike the backend there is no
      # runtime credential that could be confused with the deploy session.
      AWS_REGION: ${{ vars.AWS_REGION }}

      EKS_CLUSTER_NAME: pickpickgo-eks
      ECR_REPOSITORY: asasera-new-frontend
      IMAGE_TAG: ${{ github.sha }}

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Check out code
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Validate React / TypeScript
      # ---------------------------------------------------------
      - name: Check i18n files are in sync
        run: |
          npm ci
          npx tsc -b

      # ---------------------------------------------------------
      # 3. Validate Kubernetes manifest
      # ---------------------------------------------------------
      - name: Validate production Kubernetes manifest
        run: npm run check:k8s

      # ---------------------------------------------------------
      # 4. AWS authentication
      # ---------------------------------------------------------
      # OIDC, not a stored key pair. A role of its own, not the backend's: this
      # one can push to asasera-new-frontend and read the cluster description,
      # and its Kubernetes rights are narrower still -- no Secrets, no Jobs,
      # nothing cluster-scoped. Trust is pinned to this repository on
      # refs/heads/main using GitHub's immutable owner and repository ids.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: asasera-frontend-${{ github.run_id }}

      # ---------------------------------------------------------
      # 5. Login to Amazon ECR
      # ---------------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ---------------------------------------------------------
      # 6. Configure kubectl
      # ---------------------------------------------------------
      - name: Install and configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

          kubectl version --client
          kubectl config current-context

      # ---------------------------------------------------------
      # 7. Build + Push Docker image to ECR
      # ---------------------------------------------------------
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Building ASASERA frontend image..."
          docker build --build-arg GIT_COMMIT="${IMAGE_TAG}" -t "${IMAGE}" .

          echo "Pushing ASASERA frontend image to ECR..."
          docker push "${IMAGE}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 8. Deploy exact SHA image to Kubernetes
      # ---------------------------------------------------------
      - name: Deploy frontend to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          EXPECTED_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Deploying ASASERA frontend..."

          # Replace only the frontend container image in the manifest
          sed -i \
            "s|image: .*asasera-new-frontend.*|image: ${EXPECTED_IMAGE}|" \
            kubernetes/frontend-deployment.yaml

          kubectl apply -f kubernetes/frontend-deployment.yaml

          if ! kubectl rollout status \
            deployment/asasera-frontend-deployment \
            --timeout=180s; then

            echo "========================================="
            echo "ASASERA FRONTEND DEPLOYMENT FAILED"
            echo "========================================="

            kubectl get deployment \
              asasera-frontend-deployment \
              -o wide || true

            kubectl get pods \
              -l app=asasera-frontend-app \
              -o wide || true

            kubectl describe deployment \
              asasera-frontend-deployment || true

            kubectl describe pods \
              -l app=asasera-frontend-app || true

            echo "========================================="
            echo "CONTAINER LOGS"
            echo "========================================="

            for pod in $(kubectl get pods \
              -l app=asasera-frontend-app \
              -o jsonpath='{.items[*].metadata.name}'); do

              echo "----- ${pod} -----"

              kubectl logs \
                "${pod}" \
                -c asasera-frontend-container \
                --tail=200 || true
            done

            echo "========================================="
            echo "RECENT KUBERNETES EVENTS"
            echo "========================================="

            kubectl get events \
              --sort-by='.lastTimestamp' || true

            exit 1
          fi

          DEPLOYED_IMAGE=$(kubectl get deployment \
            asasera-frontend-deployment \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="asasera-frontend-container")].image}')

          echo "Expected image: ${EXPECTED_IMAGE}"
          echo "Deployed image: ${DEPLOYED_IMAGE}"

          if [ "${DEPLOYED_IMAGE}" != "${EXPECTED_IMAGE}" ]; then
            echo "Frontend image mismatch."
            exit 1
          fi

          echo "ASASERA frontend deployed successfully."

      # Same reasoning as the backend: the previous deploy left /privacy
      # answering 200 with the SPA shell, and every status-code check called
      # that healthy. This compares the body against the shell itself and
      # fails the job when they match.
      - name: Post-deploy smoke test
        run: npm run smoke -- https://asasera.com "${{ github.sha }}"
