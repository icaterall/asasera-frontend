# Replaces the default server block in the nginx image, which has neither a
# health endpoint for the probes nor a fallback for client-side routes.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # All three probes in kubernetes/frontend-deployment.yaml call this, on
    # every pod, every few seconds. Answered from the config rather than by a
    # file so it costs nothing and cannot be affected by the fallback below.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints everything in here, so a name only ever refers to one
    # version of one file and the cache cannot go stale.
    # One directive rather than `expires` plus `add_header`, which would emit
    # two competing Cache-Control headers.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The one file that must be revalidated. It names the hashed bundles, and
    # the app lazy-loads its routes — so a stale copy points at chunks that no
    # longer exist and /about breaks, rather than merely looking out of date.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # An API path must never reach the SPA fallback.
    #
    # This is the single most expensive default in this file. `try_files ...
    # /index.html` answers EVERY unmatched path with 200 and an HTML document,
    # so a front end that accidentally calls its own origin — an empty
    # VITE_API_URL, a relative path, a proxy that did not start — receives a
    # web page where it expected JSON. The symptom is a JSON parse error that
    # looks like a backend fault, and the real cause is invisible.
    #
    # It masked two separate bugs in one session. Now it 404s loudly instead.
    location /api/ {
        add_header Content-Type application/json always;
        return 404 '{"error":{"code":"not_found","message":"The API is not served from this host. Use backend.asasera.com."}}';
    }

    # The legal pages Meta fetches directly.
    #
    # Real files under public/, matched exactly and served ahead of the
    # fallback. Without these an incorrect path would still return 200 with the
    # SPA shell — which is exactly what happened: /privacy answered 200 with a
    # document containing the word "privacy" zero times, and no check that
    # looked only at the status code could tell.
    location = /privacy {
        try_files /privacy/index.html =404;
    }
    location = /data-deletion {
        try_files /data-deletion/index.html =404;
    }

    # BrowserRouter owns /about and the catch-all. Without this, following a
    # link works but refreshing on it asks nginx for a file that was never
    # built, and the visitor gets nginx's own 404 instead of the app's.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
