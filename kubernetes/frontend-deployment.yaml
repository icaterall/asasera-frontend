# The rewrite, deployed alongside the site it will replace.
#
# Every name here is `asasera-new-frontend-*`, deliberately distinct from the
# live `asasera-frontend-*` resources that serve asasera.com today. They are
# separate Deployments in the same namespace: applying this file cannot restart,
# retarget or roll back the live site, and `kubectl set image` in the workflow
# only ever names the resources below.
#
# Traffic reaches this via new.asasera.com on the shared ALB ingress. Going live
# is then a one-line change to that ingress rule -- repoint the asasera.com host
# at asasera-new-frontend-service -- with the old Deployment still running and
# one edit away from being the rollback.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asasera-new-frontend-deployment
  labels:
    app: asasera-new-frontend-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asasera-new-frontend-app
  template:
    metadata:
      labels:
        app: asasera-new-frontend-app
    spec:
      containers:
      - name: asasera-new-frontend-container
        image: 533267169159.dkr.ecr.us-east-2.amazonaws.com/asasera-new-frontend:latest
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        ports:
        - containerPort: 80
        startupProbe:
          httpGet:
            path: /healthz
            port: 80
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          periodSeconds: 20
          failureThreshold: 5
        imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: asasera-new-frontend-service
  labels:
    app: asasera-new-frontend-app
spec:
  type: NodePort
  selector:
    app: asasera-new-frontend-app
  ports:
    - port: 80
      targetPort: 80
