apiVersion: apps/v1
kind: Deployment
metadata:
  name: asasera-frontend-deployment
  labels:
    app: asasera-frontend-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asasera-frontend-app
  template:
    metadata:
      labels:
        app: asasera-frontend-app
    spec:
      containers:
      - name: asasera-frontend-container
        image: 533267169159.dkr.ecr.us-east-2.amazonaws.com/asasera-new-frontend:latest
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        ports:
        - containerPort: 80
        startupProbe:
          httpGet:
            path: /healthz
            port: 80
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          periodSeconds: 20
          failureThreshold: 5
        imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: asasera-frontend-service
  labels:
    app: asasera-frontend-app
spec:
  type: NodePort
  selector:
    app: asasera-frontend-app
  ports:
    - port: 80
      targetPort: 80
