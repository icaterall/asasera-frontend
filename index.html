<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>أساسيرا — أساسٌ متينٌ للمنتجات ثنائية اللغة</title>
    <meta
      name="description"
      content="أساسيرا هي طبقة الأساس للفرق التي تبني واجهاتٍ ثنائية اللغة وسهلة الوصول ومتجاوبة — العربية والإنجليزية مواطنتان من الدرجة الأولى منذ أول سطرٍ برمجي."
    />
    <meta name="theme-color" content="#fbfbfe" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--
      Applies the stored theme and language before first paint, so the page
      never flashes light-then-dark or LTR-then-RTL. Mirrors the defaults in
      src/context/theme-context.ts and src/i18n/languages.ts.
    -->
    <script>
      (function () {
        try {
          var root = document.documentElement

          var storedTheme = localStorage.getItem('asasera.theme')
          var theme =
            storedTheme === 'light' || storedTheme === 'dark'
              ? storedTheme
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          if (theme === 'dark') root.classList.add('dark')
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'dark' ? '#070710' : '#fbfbfe')

          // Arabic-first: a returning visitor's stored choice wins, everyone
          // else gets Arabic regardless of browser locale.
          var stored = localStorage.getItem('asasera.language')
          var lang = (stored || 'ar').toLowerCase().split('-')[0]
          if (lang !== 'ar' && lang !== 'en') lang = 'ar'
          root.lang = lang
          root.dir = lang === 'ar' ? 'rtl' : 'ltr'
        } catch (error) {
          /* Storage unavailable — the React providers will sort it out. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
