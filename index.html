<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/webp" sizes="384x384" href="/logo-box-loader.webp" />
    <link rel="apple-touch-icon" href="/logo-box-loader.webp" />

    <title>أساسيرا — أداة تعمل داخل المحاضرة الجامعية</title>
    <meta
      name="description"
      content="أساسيرا أداة تعمل داخل المحاضرة الجامعية: يفتح المعلّم رابطًا فيجد مقرّره مرسومًا درسًا بدرس، وينضمّ الطلاب برمزٍ واسمٍ أوّل، وتنتهي الجلسة بجملةٍ واحدة بدل لوحة مؤشّرات."
    />
    <meta name="theme-color" content="#fbfbfe" />

    <!--
      Fonts are self-hosted, not fetched from a CDN. The pair is declared in
      src/styles/tokens.css: Noto Sans Arabic for Arabic, HK Grotesk for Latin
      and numerals, split by unicode-range so a mixed line is two chosen faces
      rather than one face plus whatever the OS supplies.
    -->

    <!--
      Applies the stored theme and language before first paint, so the page
      never flashes light-then-dark or LTR-then-RTL. Mirrors the defaults in
      src/context/theme-context.ts and src/i18n/languages.ts.
    -->
    <script>
      (function () {
        try {
          var root = document.documentElement

          var storedTheme = localStorage.getItem('asasera.theme')
          var theme =
            storedTheme === 'light' || storedTheme === 'dark'
              ? storedTheme
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          if (theme === 'dark') root.classList.add('dark')
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'dark' ? '#070710' : '#fbfbfe')

          // A prior user choice wins. On a first visit, use the primary browser
          // or device language: Arabic is RTL; every other language is English.
          var stored = null
          try { stored = localStorage.getItem('asasera.language') } catch (storageError) {}
          var browserLanguage = (navigator.languages && navigator.languages[0]) || navigator.language || 'en'
          var savedLanguage = (stored || '').toLowerCase().split('-')[0]
          var lang = savedLanguage === 'ar' || savedLanguage === 'en'
            ? savedLanguage
            : /^ar(?:-|$)/i.test(browserLanguage)
              ? 'ar'
              : 'en'
          root.lang = lang
          root.dir = lang === 'ar' ? 'rtl' : 'ltr'
        } catch (error) {
          /* Storage unavailable — the React providers will sort it out. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
